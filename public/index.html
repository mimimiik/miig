<!-- Файл 1: index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MIM Galaxy Ultimate · Все функции</title>
  <link rel="manifest" href="data:application/manifest+json,{name:'MIM Galaxy',short_name:'MIM',theme_color:'#8B5CF6',display:'standalone'}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="https://unpkg.com/recordrtc@5.6.2/RecordRTC.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script type="importmap">
    { "imports": { "@mlc-ai/web-llm": "https://esm.run/@mlc-ai/web-llm" } }
  </script>
</head>
<body>
<div class="phone-frame">
  <!-- Slide Panel -->
  <div class="slide-panel" id="slidePanel">
    <div class="panel-header">
      <h3 id="panelTitle">Настройки</h3>
      <i class="fas fa-times" onclick="closeSlidePanel()"></i>
    </div>
    <div class="panel-content" id="panelContent"></div>
  </div>

  <!-- QR Modal -->
  <div class="qr-overlay" id="qrOverlay" onclick="closeQR()"></div>
  <div class="qr-modal" id="qrModal">
    <h3>Ваш QR-код</h3>
    <div id="qrcode"></div>
    <button class="btn" onclick="closeQR()">Закрыть</button>
  </div>

  <!-- Splash Screen -->
  <div class="screen splash-screen active" id="splashScreen">
    <canvas id="splashCanvas"></canvas>
    <div class="splash-content">
      <div class="splash-logo">🚀✨</div>
      <div class="splash-title">MIM GALAXY</div>
      <div class="splash-subtitle">космический мессенджер</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </div>

  <!-- Auth Screen -->
  <div class="screen" id="authScreen">
    <div class="auth-header">
      <div class="auth-logo"><i class="fas fa-lock"></i></div>
      <div class="auth-title">Вход / Регистрация</div>
    </div>
    <div class="auth-content">
      <div class="auth-tabs">
        <div class="auth-tab active" onclick="switchAuthTab('login')">Вход</div>
        <div class="auth-tab" onclick="switchAuthTab('register')">Регистрация</div>
      </div>
      <div id="loginForm" class="auth-form active">
        <div class="input-wrapper"><i class="fas fa-user"></i><input type="text" id="loginUsername" placeholder="Логин" value="demo"></div>
        <div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" id="loginPassword" placeholder="Пароль" value="123456"></div>
        <button class="btn" onclick="login()">Войти</button>
        <p class="auth-link"><a href="#" onclick="switchAuthTab('register')">Нет аккаунта? Зарегистрироваться</a></p>
      </div>
      <div id="registerForm" class="auth-form">
        <div class="input-wrapper"><i class="fas fa-user"></i><input type="text" id="regUsername" placeholder="Придумайте логин"></div>
        <div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" id="regPassword" placeholder="Пароль"></div>
        <div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" id="regConfirm" placeholder="Подтвердите пароль"></div>
        <button class="btn" onclick="register()">Зарегистрироваться</button>
        <p class="auth-link"><a href="#" onclick="switchAuthTab('login')">Уже есть аккаунт? Войти</a></p>
      </div>
    </div>
  </div>

  <!-- Main Screen -->
  <div class="screen" id="mainScreen">
    <div id="tabContent" class="tab-content"></div>
    <div class="bottom-nav">
      <div class="nav-item active" data-tab="chats" onclick="switchTab('chats')"><i class="fas fa-comment"></i><span>Чаты</span></div>
      <div class="nav-item" data-tab="contacts" onclick="switchTab('contacts')"><i class="fas fa-address-book"></i><span>Контакты</span></div>
      <div class="nav-item" data-tab="tools" onclick="switchTab('tools')"><i class="fas fa-tools"></i><span>Инструменты</span></div>
    </div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
